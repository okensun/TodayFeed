name: CI

# A branch that has a pull request open would otherwise be built twice for the same
# commit, once for the push and once for the pull request. Pushes are limited to main, so
# a branch is built by its pull request and main is built when the merge lands.
on:
  push:
    branches: [ main ]
  pull_request:

# head_ref is set for a pull request and names the branch. github.ref would name
# refs/pull/N/merge instead, which does not match the push run's ref, so a shared group
# needs head_ref first.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No secrets are configured for this job on purpose. Every data source is keyless,
      # so this run also proves that a fresh copy builds with no setup at all.
      - name: Build, check style, run tests
        run: ./gradlew assembleDebug detekt ktlintCheck testDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 5
