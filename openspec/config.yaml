schema: spec-driven

context: |
  PROJECT: TodayFeed — a LINE TODAY / VOOM style content-feed Android app.
  This is a take-home pre-assessment for a Senior Android Engineer role at LINE Taiwan.
  It is graded on: engineering judgment & trade-offs, Android depth, working with AI,
  communication & documentation, code quality. Judgment beats completeness.

  HARD CONSTRAINTS (from the assignment):
  - Kotlin, minSdk 24.
  - Must build from a clean checkout with a SINGLE command (`./gradlew assembleDebug`).
    No step may require a secret to be present. Optional secrets degrade gracefully.
  - Incremental git history with real, logical commits. Never squash into one commit.
  - Core flow: Feed list -> Detail -> Save/Unsave, plus a Saved list screen.
  - Saved items MUST be readable offline after first load (persist the article body,
    not just an id).
  - Feed is HETEROGENEOUS: article cards plus visually distinct card types from other
    real sources of a different shape.
  - A FRESHNESS POLICY is the centrepiece: per-source cadence (weather changes by the
    minute, articles by the hour), stale-while-revalidate, must be unit tested, and the
    reasoning must be written up in the README.
  - Every UI state handled explicitly: loading / empty / error / offline.

  ARCHITECTURE: component-based Clean Architecture. Each domain capability is a
  "component" that owns its own layers, so components are independent by construction
  and dependency inversion is enforced by MODULE BOUNDARIES rather than by discipline:
    <component>/api    - the repository INTERFACES, plus the models they speak in. Pure
                         Kotlin, no Android, no framework. The interface is the reason this
                         module exists; the model is only its vocabulary. Without it, ui and
                         domain would have to call into data. This is also the ONLY layer
                         other components may see.
    <component>/domain - use cases / business logic. Pure Kotlin. Depends on its own api.
    <component>/data   - implements the api contracts with Retrofit + Room. Nothing
                         depends on a data module except :app (for DI wiring).
    <component>/ui     - Compose screens, card composables and ViewModels. Depends on
                         its own api + :core:designsystem. NEVER on its own data module.
  A layer that would be empty is not created. Only the articles component earns a
  separate domain module; the three secondary sources have no business logic worth one.

  MODULE GRAPH (15 modules built; 3 more only if time allows):
    :app                            NavHost, bottom bar, Hilt aggregation. Thin.
    :core:designsystem              theme (light + dark), ContentState, state composables
    :core:network                   OkHttp/Retrofit/serialization setup. No endpoints.
    :core:database                  shared Room configuration + type converters only
    :core:freshness                 the per-source freshness policy. Pure Kotlin, injected Clock.
    :core:testing                   fakes, FakeClock, FakeConnectivity, coroutine test rules
    :components:articles:{api,domain,data,ui}   Spaceflight News. Feed cards, detail, saved.
    :components:weather:{api,data,ui}           Open-Meteo. Hero card.
    :components:feed:{domain,ui}                heterogeneous composition + the Reading screen
  Only if the schedule allows, added last (3 more modules):
    :components:movie:{api,data,ui}             Studio Ghibli. Film carousel.
  CUT for time, recorded in the README deferred list, NOT to be built:
    serviceCard (DummyJSON), search/filter, animations. See docs/ROADMAP.md.

  DEPENDENCY RULES (enforced, not advisory):
  - A component's ui/domain/api NEVER depends on any data module, its own included.
  - A component NEVER depends on another component's domain, data or ui. Only on api.
    Exception: :components:feed:ui depends on each component's ui, because it renders
    their card composables. That is the composition root for the feed and is the reason
    feed is a component rather than a screen inside :app.
  - Card composables take api models directly. No per-card UI-model mapping layer.
  - Each component owns its OWN Room database. There is no shared schema, so no
    cross-component migration coupling and no cycle between :core:database and data
    modules. No query ever spans components.
  - Screens: Reading = :components:feed:ui. Article detail and Saved =
    :components:articles:ui. Navigation graph lives in :app; features expose callbacks.

  TECH STACK (decided; record rejected alternatives in DECISIONS.md):
  - UI: Jetpack Compose, Material 3, light + dark theme.
  - Presentation: MVVM + unidirectional data flow. StateFlow, coroutines, Flow.
  - DI: Hilt. (The reference architecture this is modelled on uses plain Dagger 2 with
    hand-written component graphs; that is an automotive multi-process constraint which
    does not apply here. Explain the difference in DECISIONS.md.)
  - Network: Retrofit + OkHttp + kotlinx.serialization.
  - Persistence: Room, per component (offline-first single source of truth).
  - Pagination: HAND-ROLLED (deliberately NOT Paging 3) so the freshness /
    stale-while-revalidate logic stays fully under our control and unit testable.
  - Gradle: Kotlin DSL, version catalog (libs.versions.toml), convention plugins in a
    build-logic included build. Project dependencies use string paths, not typesafe
    project accessors.
  - Tests: JUnit + kotlinx-coroutines-test + Turbine + HAND-WRITTEN FAKES, not a mocking
    framework. Fakes over mocks because the freshness tests assert on behaviour over
    time, which a fake clock and a fake source express far more readably than
    stubbed call expectations.
  - Static analysis: detekt + ktlint in CI. 140-char lines, 4-space indent, no star
    imports, ReturnCount <= 3, TooManyFunctions <= 15.
  - CI: GitHub Actions (build + detekt/ktlint + unit test on push).

  DATA SOURCES:
  - Articles (required): https://api.spaceflightnewsapi.net/v4/articles/ — paginated, no key.
  - Weather hero: https://api.open-meteo.com/v1/forecast — no key, current + daily.
  - Service cards: https://dummyjson.com/products — no key. CUT for time. Not built.
  - Movie carousel: https://ghibliapi.vercel.app/films — no key. 22 Studio Ghibli films
    with title, description, director, release_date, rt_score, running_time, a poster
    (`image`) and a wide banner (`movie_banner`). The list is STATIC. Verified to answer
    304 Not Modified with 0 bytes when sent If-None-Match. OPTIONAL: build only if the
    schedule allows, after the submission documents are finished.
    Chosen over TMDB because TMDB requires an API key, which would break the "clean
    checkout, single command, no secrets" ground rule.

  EVERY data source is keyless. The project contains NO secrets and needs NO local
  configuration of any kind — do not introduce a mechanism for one.

  SCHEDULE: hard deadline Thursday 2026-08-27. About 16 working hours total, in four
  blocks of about four hours. Sunday evening: the skeleton. Monday evening: the freshness
  policy and the article feed, which is the graded centre. Tuesday evening: detail, save,
  saved screen and the weather card, after which every must-have is done. Wednesday
  evening: the submission documents FIRST, then the movie component only with whatever
  time is left. Thursday: verify a fresh clone and submit, no new features.
  The rule that matters: documents are a must-have and are never the thing that gets cut.

  FRESHNESS POLICY (decided; full write-up goes in the README):
  Refresh happens only at moments the user can see: app comes to the foreground, a tab is
  shown, pull to refresh, and scrolling to the end for the next page. No WorkManager and
  no background work at all.
  The policy has TWO independent dimensions, measured rather than guessed:
    1. How fast the content really changes -> a per-source TTL, chosen from what the card
       means in a real product. Where the server declares its own `Cache-Control:
       max-age`, that wins over our number. Spaceflight News declares max-age=600.
    2. What it costs to ask -> whether the source answers 304 Not Modified. Verified:
       DummyJSON and Ghibli do (0 bytes), Spaceflight News and Open-Meteo do not.
       So the expensive sources are the ones that cannot be revalidated cheaply, which is
       the opposite of what "static data is cheap" intuition suggests.
  On a metered connection every TTL is multiplied, and sources with no cheap
  revalidation are multiplied more. Connectivity is an injected interface returning
  Unmetered / Metered / Offline, so :core:freshness stays pure Kotlin.
  The decision type has four cases, which line up with the four UI states:
  ServeCache, ServeCacheAndRevalidate (stale-while-revalidate), FetchBlocking (nothing
  cached yet), ServeStaleOffline.
  Saved articles are never evicted and never expire. Freshness governs the feed, not the
  user's own saved copies.

  CONVENTIONS:
  - Conventional commit subjects (feat:, fix:, refactor:, test:, docs:, chore:, build:),
    with the OpenSpec change name as the scope. Subject under 72 characters.
  - Commit message BODY is at most 5 lines. Say what changed and why, nothing else.
    Git already records the diff, so never list the files.
  - Pull request bodies use .github/pull_request_template.md.
  - Git author is `okensun <okensun@users.noreply.github.com>`. No other identity, and
    no employer email, may appear anywhere in the history or the content.
  - Kotlin sources in src/main/kotlin. Package names: com.okensun.todayfeed.<component>.<layer>.
  - Comments say what the CURRENT code means. Never narrate the change ("previously...",
    "now uses..."), never restate the code, never leave commented-out code. Git records
    history. The best comment is the one a clearer name made unnecessary.
  - Prefer StateFlow over SharedFlow(replay = 1) for always-available state. Collect in
    repeatOnLifecycle. Cancel the scope, not child jobs. No blocking calls on the main
    thread. No expensive work in init or composition.
  - Prefer safe calls over !!. Catch specific exceptions.
  - Test names use backticks and read as sentences.
  - AGENTS.md holds the full agent guide; CLAUDE.md is a short in-context digest that
    points at it. Keep both truthful as the code changes.
  - The project is modelled on the ARCHITECTURE and CONVENTIONS of a proprietary
    reference codebase. Nothing is copied from it: no text, no copyright headers, no
    naming, no internal ticket conventions. Write everything fresh.
  - No secrets, keys, or personal data in the repository.

  WRITING STYLE (applies to every document: README, DECISIONS.md, AI_USAGE.md, AGENTS.md,
  CLAUDE.md, OpenSpec artifacts, code comments, commit messages, PR bodies):
  - Plain, general English. A reader below high-school English level must be able to
    follow it. The reviewers are not native English speakers, and clear writing is a
    graded item, so simple wording helps the score rather than hurting it.
  - One idea per sentence. Short sentences. Active voice.
  - Use common words. If a technical term is needed, say what it means the first time.
  - No rhetorical flourishes, no long chains of clauses, no dashes used for drama.
  - Describe things in general terms first, then give the detail.

  CODE REVIEW COMMENTS:
  - Always inline, on the exact line. Never a long summary comment at the top of the PR.
  - Two to three lines maximum per comment. Say the problem, then the fix.
  - No praise-only comments. If nothing is wrong, leave no comment.

rules:
  proposal:
    - State the trade-off explicitly; name the alternative that was rejected and why.
    - Call out which assignment must-have or nice-to-have the change satisfies.
  tasks:
    - Each task must be small enough to become one logical git commit.
    - Tests that cover cache/freshness or async logic are tasks, not afterthoughts.

operations:
  apply:
    guidance:
      - Commit incrementally, one logical commit per completed task group.
      - Never squash. The git history is part of the deliverable.
