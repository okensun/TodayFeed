# Robolectric ships a jar per Android level and lags the newest one. compileSdk is 37
# because the Compose BOM requires it, and a library module's manifest takes its targetSdk
# from compileSdk, which Robolectric then refuses as higher than it supports.
# Pinning the emulated level here keeps that out of every test class. Raise it when
# Robolectric ships 37.
sdk=36
